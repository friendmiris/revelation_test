 .chapter-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:12px 0 18px}.chapter-btn{background:#edf2ff;border:1px solid #cbd7f6;color:#293f83;border-radius:13px;padding:13px 5px;font-weight:700}.chapter-btn.chosen{background:#293f83;color:white}.note-card{border:1px solid #e3e9f5;border-radius:15px;padding:17px;margin:12px 0;background:#fff}.note-card .reference{background:#f4f7ff}.note-card p{margin:8px 0;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.note-card .user-answer{color:#a83b32}.note-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.section-title{font-size:20px;margin:5px 0 12px}.mini{font-size:13px;color:#53647f}.chip{background:#f0f4ff;padding:5px 9px;border-radius:7px;display:inline-block;font-size:12px}.tabs{grid-template-columns:repeat(5,1fr)}@media(max-width:640px){.chapter-grid{grid-template-columns:repeat(4,1fr)}.tabs{grid-template-columns:repeat(3,1fr)}.tab{font-size:12px}} </style></head><body><div class="shell"><header><h1>📖 계시록 암송 연습실</h1><p>1~7장 · 장별 제목 / 단답형 빈칸 / 성구 서술형<br>직접 써 보고, 채점하고, 틀린 문제만 다시 연습해요.</p></header><nav class="tabs"><button class="tab active" data-tab="title">① 장별 제목</button><button class="tab" data-tab="blank">② 성구 빈칸</button><button class="tab" data-tab="essay">③ 성구 전체 쓰기</button><button class="tab" data-tab="chapter">📚 장별 학습</button><button class="tab" data-tab="notebook">📝 오답노트</button></nav><main class="panel"><div id="extraPanel" hidden></div><div id="quizPanel"><div class="top"><div><strong id="modeName"></strong><div class="sub" id="count"></div></div><div class="stats"><span class="stat" id="score"></span><span class="stat" id="wrongCount"></span></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="filters"><label class="sub">범위 <select id="chapterSelect"><option value="all">전체</option><option value="1">1장</option><option value="2">2장</option><option value="3">3장</option><option value="4">4장</option><option value="5">5장</option><option value="6">6장</option><option value="7">7장</option></select></label><label class="sub"><input type="checkbox" id="wrongOnly"> 오답만 연습</label><button class="secondary" id="shuffle">🔀 문제 섞기</button></div><div id="content"></div><div class="actions" id="actions"><button class="secondary" id="prev">← 이전</button><button class="main" id="check">정답 확인</button><button class="secondary" id="reveal">정답 보기</button><button class="secondary" id="next">다음 →</button></div></div></main><p class="tiny">학습 자료는 제공한 문구를 기준으로 채점해요. 띄어쓰기·구두점·장절 숫자는 채점에서 제외하고, 서술형은 글자 일치율과 빠진 부분을 함께 보여줘요. 자동 채점은 표현 차이를 완벽히 판단하지 못하므로 정답 원문도 확인해 주세요. 진행 위치와 작성 중인 답안도 이 기기의 브라우저에 저장됩니다. 초기화 버튼을 누르면 해당 기록이 삭제됩니다.</p></div><script>const chapters=[
['계 1장 1~8절','계시록 전장의 요약과 결론'],['계 1장 9~20절','계시록 사건의 시작과 일곱 별과 일곱 금 촛대의 비밀'],['계 2장','일곱 교회 사자에게 보낸 편지'],['계 3장','일곱 교회 사자에게 보낸 편지'],['계 4장','영계 하나님의 보좌와 계열'],['계 5장','일곱 인으로 봉한 책'],['계 6장','배도한 선천 해⋅달⋅별에 대한 심판'],['계 7장','새 창조 된 영적 새 이스라엘 열두 지파']];

['3:16','네가 이같이 (①)하여 더웁지도 아니하고 차지도 아니하니 내 입에서 너를 (②)',['미지근','토하여 내치리라']],
['3:17','네가 말하기를 나는 (①)라 부요하여 부족한 것이 없다 하나 네 곤고한 것과 가련한 것과 가난한 것과 (②)과 벌거벗은 것을 알지 못하도다',['부자','눈 먼것']],
['3:18','내가 너를 권하노니 내게서 불로 (①)을 사서 부요하게 하고 (②)을 사서 입어 벌거벗은 수치를 보이지 않게 하고 안약을 사서 눈에 발라 보게 하라',['연단한 금','흰 옷']],
['4:2','내가 곧 (①)하였더니 보라 (②)에 보좌를 베풀었고 그 보좌 위에 앉으신 이가 있는데',['성령에 감동','하늘']],

const $=id=>document.getElementById(id);const normalize=s=>(s||'').toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'').replace(/[0-9]/g,'');const original={title:chapters,blank:blanks,essay:essays};let mode='title',index=0,order=[],filter='all',wrongOnly=false;let records={};try{records=JSON.parse(localStorage.getItem('revMemoryRecordsV3')||'{}')}catch{};const key=(m,i)=>m+':'+i;const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function items(){return original[mode]}function save(){try{localStorage.setItem('revMemoryRecordsV3',JSON.stringify(records))}catch{}}function buildOrder(shuffle=false){order=items().map((_,i)=>i).filter(i=>{const label=items()[i][0];return(filter==='all'||(mode==='title'?label.match(/\d+장/)?.[0]===filter+'장':label.split(':')[0]===filter))&&(!wrongOnly||records[key(mode,i)]?.ok===false)});if(shuffle)order.sort(()=>Math.random()-.5);index=0;render()};function similarity(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a===b)return 1;let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let next=[i];for(let j=1;j<=b.length;j++)next[j]=Math.min(next[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=next}return Math.max(0,1-prev[b.length]/Math.max(a.length,b.length,1))};function splitWords(s){return s.replace(/^\d+\s*/gm,'').split(/\s+/).filter(Boolean)}function missingHtml(input,answer){const supplied=splitWords(input).map(normalize);return splitWords(answer).map(w=>`<span class="${supplied.includes(normalize(w))?'mark':'mis'}">${escapeHtml(w)}</span>`).join(' ')}function build(){const i=order[index],item=items()[i],rec=records[key(mode,i)];$('count').textContent=`${order.length?index+1:0} / ${order.length}문제`;$('bar').style.width=(order.length?(index+1)/order.length*100:0)+'%';const group=items().map((_,j)=>records[key(mode,j)]).filter(Boolean);$('score').textContent=`정답 ${group.filter(r=>r.ok).length}`;$('wrongCount').textContent=`오답 ${group.filter(r=>!r.ok).length}`;$('modeName').textContent=({title:'장별 제목 직접 쓰기',blank:'성구 빈칸 넣기',essay:'성구 전체 암송하기'})[mode];$('actions').style.display=order.length?'flex':'none';if(!order.length){$('content').innerHTML='<div class="empty">해당하는 문제가 없어요. 범위나 오답 필터를 변경해 주세요.</div>';return}let html=`<div class="question">${mode==='title'?escapeHtml(item[0])+'의 제목은?':'계 '+escapeHtml(item[0])}</div>`;if(mode==='title')html+=`<label class="answer-label">장별 제목을 정확히 적어 보세요</label><input class="answer" id="typed" autocomplete="off" placeholder="제목 전체를 입력하세요">`;if(mode==='blank'){html+=`<div class="verse">${escapeHtml(item[1])}</div>`;item[2].forEach((a,n)=>html+=`<label class="answer-label">${n+1}번 빈칸</label><input class="answer blank-input" autocomplete="off" placeholder="${n+1}번 정답을 입력하세요">`)}if(mode==='essay')html+=`<label class="answer-label">성구를 처음부터 끝까지 써 보세요</label><textarea id="typed" placeholder="기억나는 성구를 적어 보세요. 줄바꿈은 자유롭게 해도 돼요."></textarea>`;html+='<div id="feedback"></div>';$('content').innerHTML=html;$('prev').disabled=index===0;$('next').disabled=index===order.length-1;if(rec){if(mode==='blank')document.querySelectorAll('.blank-input').forEach((el,n)=>el.value=rec.value[n]||'');else $('typed').value=rec.value||'';showFeedback(rec,item)} }function showFeedback(rec,item){let text=rec.shown?'<div><b>정답 공개 · 직접 맞힌 것으로 집계하지 않아요.</b></div>':'';if(mode==='blank')text=item[2].map((a,n)=>`<div>${rec.parts[n]?'<span class="correct">✓ 일치</span>':'<span class="wrong">✗ 오답</span>'} · ${n+1}번 / 내 답: ${escapeHtml(rec.value[n]||'(미입력)')} / 정답: <b>${escapeHtml(a)}</b></div>`).join('');else{const ans=mode==='title'?item[1]:item[1];text=`<div>${rec.ok?'<span class="correct">✓ 정답!</span>':'<span class="wrong">✗ 다시 연습해 보세요</span>'} ${mode==='essay'?`(글자 일치율 약 ${Math.round(rec.sim*100)}%)`:''}</div><div class="reference"><b>정답</b>\n${escapeHtml(ans)}</div>`;if(mode==='essay'&&!rec.ok&&rec.value)text+=`<details style="margin-top:10px"><summary>빠졌거나 다른 부분 표시하기 (참고용)</summary><div class="reference" style="line-height:2">${missingHtml(rec.value,ans)}</div><div class="tiny">초록색: 입력한 단어와 일치 / 빨간색: 찾지 못한 단어. 순서는 따로 판정하지 않아요.</div></details>`} $('feedback').className='feedback'+(rec.ok?'':' bad');$('feedback').innerHTML=text}function grade(reveal=false){if(!order.length)return;const i=order[index],item=items()[i],id=key(mode,i);let value,ok,parts,sim;if(mode==='blank'){value=[...document.querySelectorAll('.blank-input')].map(el=>el.value);parts=item[2].map((a,n)=>normalize(value[n])===normalize(a));ok=parts.every(Boolean)}else{value=$('typed').value;sim=similarity(value,item[1]);ok=normalize(value)===normalize(item[1])}if(reveal){if(mode==='blank'){value=item[2].slice();parts=value.map(()=>true)}else value=item[1];ok=true;sim=1}records[id]={value,ok:reveal?false:ok,parts,sim,shown:reveal};save();showFeedback(records[id],item)}function render(){build()};document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>selectTab(btn.dataset.tab)));$('chapterSelect').onchange=e=>{filter=e.target.value;buildOrder()};$('wrongOnly').onchange=e=>{wrongOnly=e.target.checked;buildOrder()};$('shuffle').onclick=()=>buildOrder(true);$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<order.length-1){index++;render()}};$('check').onclick=()=>grade(false);$('reveal').onclick=()=>grade(true);buildOrder();
</script><script>const extraPanel=$('extraPanel'),quizPanel=$('quizPanel');let activeView='title',chapterChoice='1',chapterSequence=[],chapterIndex=0;

function renderNotebook(){const entries=[];for(const m of ['title','blank','essay'])original[m].forEach((_,i)=>{const rec=records[key(m,i)];if(rec&&!rec.ok&&!rec.shown)entries.push({m,i,rec})});let chapterFilter=extraPanel.dataset.noteChapter||'all';const filtered=entries.filter(({m,i})=>chapterFilter==='all'||(m==='title'?original[m][i][0].match(/\d+장/)?.[0]===chapterFilter+'장':original[m][i][0].split(':')[0]===chapterFilter));extraPanel.innerHTML=`<h2 class="section-title">📝 나의 오답노트</h2><p class="mini">틀린 답과 정답이 이 브라우저에 저장돼요. 다시 맞히면 오답노트에서 자동으로 사라져요. 다른 기기와는 동기화되지 않아요.</p><div class="filters"><label class="sub">장 선택 <select id="noteChapter"><option value="all">전체 장</option>${Array.from({length:7},(_,i)=>`<option value="${i+1}" ${chapterFilter===String(i+1)?'selected':''}>${i+1}장</option>`).join('')}</select></label><span class="stat">오답 ${entries.length}문제</span><button class="secondary" id="reviewAll" ${filtered.length?'':'disabled'}>선택한 오답 다시 풀기</button></div><div id="noteList">${filtered.length?filtered.map(({m,i,rec})=>`<div class="note-card"><div><span class="chip">${viewNames[m]}</span> <b>${escapeHtml(getPrompt(m,i))}</b></div><p class="user-answer">내 답: ${escapeHtml(getMyAnswer(m,rec))}</p><p class="reference"><b>정답</b><br>${escapeHtml(getCorrect(m,i))}</p><div class="note-actions"><button class="secondary note-retry" data-mode="${m}" data-i="${i}">🔁 다시 풀기</button><button class="secondary note-delete" data-mode="${m}" data-i="${i}">오답노트에서 삭제</button></div></div>`).join(''):'<div class="empty">🎉 저장된 오답이 없어요. 문제를 풀어 보세요!</div>'}</div>`;$('noteChapter').onchange=e=>{extraPanel.dataset.noteChapter=e.target.value;renderNotebook()};extraPanel.querySelectorAll('.note-retry').forEach(b=>b.onclick=()=>retryOne(b.dataset.mode,Number(b.dataset.i)));extraPanel.querySelectorAll('.note-delete').forEach(b=>b.onclick=()=>{delete records[key(b.dataset.mode,Number(b.dataset.i))];save();renderNotebook()});$('reviewAll').onclick=()=>{const first=filtered[0];if(first)retryOne(first.m,first.i)}}
function retryOne(m,i){selectTab(m);const idx=order.indexOf(i);if(idx>=0){index=idx;render();const r=records[key(m,i)];if(r){delete records[key(m,i)];save();render()}}}
</script><script>
// Version 3 resets: initial state is intentionally new; prior v2 answers stay untouched.
function resetRecordsFor(chapter,kind){
  const target=[];
  for(const m of ['title','blank','essay']){
    if(kind!=='all'&&kind!==m) continue;
    original[m].forEach((item,i)=>{
      const ch=m==='title' ? item[0].match(/\d+장/)?.[0].replace('장','') : item[0].split(':')[0];
      if(chapter==='all'||ch===String(chapter))target.push(key(m,i));
    });
  }
  target.forEach(k=>delete records[k]);save();
  if(activeView==='chapter') {chapterIndex=0;renderChapter()}
  else if(activeView==='notebook')renderNotebook();
  else buildOrder();
}
function confirmReset(chapter,kind,label){
  if(window.confirm(`${label} 기록을 초기화할까요?\n저장된 답안과 해당 오답 기록도 삭제되며 되돌릴 수 없어요.`))resetRecordsFor(chapter,kind);
}
const resetRow=document.createElement('div');
resetRow.className='filters';
resetRow.innerHTML='<button class="secondary" id="resetThisMode">↺ 현재 유형 다시 풀기</button><button class="secondary" id="resetThisRange">↺ 현재 장 다시 풀기</button><button class="secondary" id="resetAllPractice">🗑 전체 기록 초기화</button>';
document.querySelector('#quizPanel .filters').after(resetRow);
$('resetThisMode').onclick=()=>confirmReset('all',mode,viewNames[mode]+' 전체');
$('resetThisRange').onclick=()=>{const c=$('chapterSelect').value;confirmReset(c,mode,c==='all'?viewNames[mode]+' 전체':`${c}장 ${viewNames[mode]}`)};
$('resetAllPractice').onclick=()=>confirmReset('all','all','모든 문제');
const priorChapter=renderChapter;
renderChapter=function(){priorChapter();const target=extraPanel.querySelector('.chapter-grid');if(!target)return;const controls=document.createElement('div');controls.className='filters';controls.innerHTML='<button class="secondary" id="resetChosenChapter">↺ 선택한 장 처음부터 다시 풀기</button><button class="secondary" id="resetAllChapters">🗑 모든 장 기록 초기화</button>';target.after(controls);$('resetChosenChapter').onclick=()=>confirmReset(chapterChoice,'all',chapterChoice+'장 전체');$('resetAllChapters').onclick=()=>confirmReset('all','all','모든 문제')};
const priorNotebook=renderNotebook;
renderNotebook=function(){priorNotebook();const target=extraPanel.querySelector('.filters');if(!target)return;const btn=document.createElement('button');btn.className='secondary';btn.textContent='🗑 오답노트 전체 비우기';btn.onclick=()=>{if(!confirm('오답노트에 저장된 틀린 문제 기록을 모두 삭제할까요?'))return;for(const k of Object.keys(records)){if(!records[k].ok)delete records[k]}save();renderNotebook()};target.append(btn)};
</script><script>
// v4: independent progress for every tab and chapter, including unsubmitted drafts.
const sessionKey='revMemoryNavigationV4';
let progressState={views:{},chapters:{},drafts:{},activeView:'title',chapterChoice:'1'};
try{progressState={...progressState,...JSON.parse(localStorage.getItem(sessionKey)||'{}')}}catch{}
progressState.views ||= {};progressState.chapters ||= {};progressState.drafts ||= {};
function persistProgress(){try{localStorage.setItem(sessionKey,JSON.stringify(progressState))}catch{}}
function inputDraftKey(){
  if(activeView==='chapter'&&chapterSequence[chapterIndex]){
    const q=chapterSequence[chapterIndex];return 'question:'+key(q.m,q.i);
  }
  if(['title','blank','essay'].includes(activeView)&&order[index]!==undefined)return 'question:'+key(mode,order[index]);
  return null;
}
function draftInputs(){
  if(activeView==='chapter')return [...extraPanel.querySelectorAll('#chapterTyped,.ch-blank')];
  if(['title','blank','essay'].includes(activeView))return [...quizPanel.querySelectorAll('#typed,.blank-input')];
  return [];
}
function captureProgress(){
  const draftKey=inputDraftKey(),els=draftInputs();
  if(draftKey&&els.length){progressState.drafts[draftKey]=els.map(el=>el.value)}
  if(['title','blank','essay'].includes(activeView)){
    progressState.views[activeView]={index,order:[...order],filter,wrongOnly};
  }
  if(activeView==='chapter')progressState.chapters[String(chapterChoice)]=chapterIndex;
  progressState.activeView=activeView;progressState.chapterChoice=String(chapterChoice);persistProgress();
}
function restoreDraft(){
  const draftKey=inputDraftKey(),els=draftInputs();
  const draft=draftKey&&progressState.drafts[draftKey];
  if(Array.isArray(draft)&&els.length)els.forEach((el,j)=>{if(draft[j]!==undefined)el.value=draft[j]});
}
const oldBuild=build;
build=function(){oldBuild();restoreDraft()};
const oldChapterQuestion=renderChapterQuestion;
renderChapterQuestion=function(){oldChapterQuestion();restoreDraft()};
// Save drafts on every keystroke; browser reload and tab change won't lose typing.
document.addEventListener('input',e=>{if(e.target.matches('#typed,.blank-input,#chapterTyped,.ch-blank'))captureProgress()});
// Navigation: restore each type's queue/position instead of rebuilding from question one.
selectTab=function(view){
  captureProgress();activeView=view;showTabActive(view);
  if(view==='chapter'||view==='notebook'){
    quizPanel.hidden=true;extraPanel.hidden=false;
    if(view==='chapter'){
      chapterChoice=String(progressState.chapterChoice||chapterChoice);
      chapterIndex=progressState.chapters[chapterChoice]||0;renderChapter();
    }else renderNotebook();
  }else{
    extraPanel.hidden=true;quizPanel.hidden=false;mode=view;
    const saved=progressState.views[view];
    filter=saved?.filter||'all';wrongOnly=!!saved?.wrongOnly;
    $('chapterSelect').value=filter;$('wrongOnly').checked=wrongOnly;
    if(saved?.order?.length){
      const allowable=new Set(items().map((_,i)=>i));
      order=saved.order.filter(i=>allowable.has(i));
      index=Math.max(0,Math.min(saved.index||0,order.length-1));render();
    }else buildOrder();
  }
  captureProgress();
};
// The original click handlers look up selectTab dynamically, so the replacement is used.
// Store current position when switching to previous/next questions or changing filters.
document.addEventListener('click',e=>{
  if(e.target.closest('#prev,#next,#chapterPrev,#chapterNext,#shuffle,.chapter-btn')){
    // Internal handlers execute synchronously before this bubbling listener.
    captureProgress();
  }
});
$('chapterSelect').addEventListener('change',()=>captureProgress());
$('wrongOnly').addEventListener('change',()=>captureProgress());
// Chapter buttons used to reset to zero. Preserve per-chapter progress instead.
const chapterRenderBeforeV4=renderChapter;
renderChapter=function(){
  chapterRenderBeforeV4();
  extraPanel.querySelectorAll('.chapter-btn').forEach(btn=>{
    btn.onclick=()=>{
      captureProgress();chapterChoice=String(btn.dataset.ch);
      chapterIndex=progressState.chapters[chapterChoice]||0;
      progressState.chapterChoice=chapterChoice;
      persistProgress();renderChapter();
    }
  });
};
// Update saved progress when moving within chapter via onclick calls.
const chapterQuestionBeforeV4=renderChapterQuestion;
renderChapterQuestion=function(){chapterQuestionBeforeV4();if(activeView==='chapter')captureProgress()};
// Newly reset ranges must also clear their drafts and point to the first question.
const resetBeforeV4=resetRecordsFor;
resetRecordsFor=function(chapter,kind){
  resetBeforeV4(chapter,kind);
  for(const m of ['title','blank','essay']){
    if(kind!=='all'&&kind!==m)continue;
    original[m].forEach((item,i)=>{
      const ch=m==='title' ? item[0].match(/\d+장/)?.[0].replace('장','') : item[0].split(':')[0];
      if(chapter==='all'||ch===String(chapter))delete progressState.drafts['question:'+key(m,i)];
    });
    if(chapter==='all')delete progressState.views[m];
  }
  if(chapter==='all')progressState.chapters={};
  else progressState.chapters[String(chapter)]=0;
  if(activeView==='chapter') {chapterIndex=0;renderChapter()}
  persistProgress();
};
// On first load, restore the last visited tab.
selectTab(progressState.activeView||'title');
</script></body></html>
